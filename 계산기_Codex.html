<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;background:#101725;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(940px,100%)}h1{font-size:24px;margin:0 0 8px}.intro{color:#9daec9;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}.panel{background:#1a2538;border:1px solid #30405a;border-radius:20px;padding:24px}.display{background:#111b2d;border-radius:12px;padding:20px;margin-bottom:20px;min-height:140px}.label{color:#91a5c4;font-size:12px}.expression{min-height:28px;margin:8px 0;overflow-wrap:anywhere;color:#b9cbea}.result{font-size:36px;font-weight:650;text-align:right;overflow-wrap:anywhere}.result.error{font-size:22px;color:#ffb4b4}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{font:inherit;color:inherit;border:1px solid #3b4d68;border-radius:10px;background:#283750;cursor:pointer;min-height:54px;transition:background .15s}button:hover{background:#394d6c}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #a3cfff;outline-offset:3px}.operator{color:#99d3ff;background:#203c59}.equal{background:#68bcff;color:#09223b;font-weight:700}.equal:hover{background:#97d0ff}.clear{color:#ffc1bc}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:18px;margin:0}.history-head button{font-size:13px;min-height:36px;padding:0 12px}.history-list{list-style:none;padding:0;margin:20px 0 0;max-height:440px;overflow:auto}.history-list li{margin-bottom:10px}.history-item{width:100%;text-align:left;padding:14px;overflow-wrap:anywhere;line-height:1.6}.empty,.notice,.hint{color:#9daec9;font-size:13px;line-height:1.6}.hint{margin:16px 0 0}.notice{color:#ffd59a}.zero{grid-column:span 2}@media(max-width:680px){body{padding:16px}.layout{grid-template-columns:1fr}.panel{padding:18px}.history-list{max-height:280px}.result{font-size:32px}}
</style>
</head>
<body>
<main>
<h1>계산기</h1>
<p class="intro">괄호와 사칙연산을 이용해 계산하세요.</p>
<div class="layout">
<section class="panel" aria-label="계산기">
<div class="display"><div class="label">수식</div><div id="expression" class="expression" aria-live="polite">0</div><div class="label">결과</div><div id="result" class="result" role="status" aria-live="polite">0</div></div>
<div class="keys">
<button class="clear" data-action="clear" aria-label="모두 지우기">C</button><button data-value="(">(</button><button data-value=")">)</button><button data-action="delete" aria-label="한 글자 지우기">←</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="/" aria-label="나누기">÷</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="*" aria-label="곱하기">×</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="-" aria-label="빼기">−</button>
<button class="zero" data-value="0">0</button><button data-value=".">.</button><button class="operator" data-value="+" aria-label="더하기">+</button>
<button class="equal" style="grid-column:span 4" data-action="calculate">=</button>
</div><p class="hint">Enter 계산 · Backspace 삭제 · Esc 초기화<br>곱셈은 × 또는 *로 입력하세요. 예: 2 × (3 + 4)</p>
</section>
<aside class="panel" aria-label="계산 기록"><div class="history-head"><h2>계산 기록</h2><button id="clear-history">기록 지우기</button></div><p class="hint">기록을 누르면 수식을 다시 불러옵니다.</p><p id="storage-notice" class="notice" hidden></p><ul id="history" class="history-list"></ul></aside>
</div>
</main>
<script>
'use strict';
// 외부 코드 실행 없이 재귀 하강 파서로 연산 우선순위를 처리한다.
function evaluate(source) {
  let position = 0;
  function skip() { while (/\s/.test(source[position] || '') && position < source.length) position++; }
  function take(char) { skip(); if (source[position] === char) { position++; return true; } return false; }
  function primary() {
    skip();
    if (take('(')) { const value = sum(); if (!take(')')) throw new Error('괄호를 확인해 주세요'); return value; }
    const match = source.slice(position).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
    if (!match) throw new Error('수식을 확인해 주세요');
    position += match[0].length;
    return Number(match[0]);
  }
  function unary() { if (take('+')) return unary(); if (take('-')) return -unary(); return primary(); }
  function product() {
    let value = unary();
    while (true) {
      if (take('*')) value *= unary();
      else if (take('/')) { const divisor = unary(); if (divisor === 0) throw new Error('0으로 나눌 수 없습니다'); value /= divisor; }
      else return value;
    }
  }
  function sum() {
    let value = product();
    while (true) { if (take('+')) value += product(); else if (take('-')) value -= product(); else return value; }
  }
  if (!source.trim()) throw new Error('수식을 입력해 주세요');
  const value = sum(); skip();
  if (position !== source.length) throw new Error('수식을 확인해 주세요');
  if (!Number.isFinite(value)) throw new Error('계산 가능한 범위를 초과했습니다');
  return Object.is(value, -0) ? '0' : String(Number(value.toPrecision(12)));
}
const expressionEl = document.getElementById('expression');
const resultEl = document.getElementById('result');
const historyEl = document.getElementById('history');
const noticeEl = document.getElementById('storage-notice');
const storageKey = 'codex-calculator-history-v1';
let expression = '', result = '0', completed = false, history = [];
function pretty(value) { return value.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−'); }
function storageWarning() { noticeEl.hidden = false; noticeEl.textContent = '이 브라우저에서는 기록을 저장할 수 없습니다. 현재 창에서만 기록이 유지됩니다.'; }
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
  if (Array.isArray(saved)) history = saved.filter(item => item && typeof item.expression === 'string' && typeof item.result === 'string').slice(0, 200);
} catch { storageWarning(); }
function saveHistory() { try { localStorage.setItem(storageKey, JSON.stringify(history)); } catch { storageWarning(); } }
function render() { expressionEl.textContent = expression ? pretty(expression) : '0'; resultEl.textContent = result; }
function renderHistory() {
  historyEl.replaceChildren();
  if (!history.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '아직 계산 기록이 없습니다.'; historyEl.append(li); return; }
  history.forEach(item => {
    const li = document.createElement('li'), button = document.createElement('button');
    button.className = 'history-item'; button.textContent = pretty(item.expression) + ' = ' + item.result;
    button.addEventListener('click', () => { expression = item.expression; result = item.result; completed = false; resultEl.classList.remove('error'); render(); });
    li.append(button); historyEl.append(li);
  });
}
function input(value) {
  if (expression.length >= 500 && !completed) { result = '수식은 500자까지 입력할 수 있습니다'; resultEl.classList.add('error'); render(); return; }
  if (completed) expression = /^[+*/-]$/.test(value) ? result : '';
  completed = false; resultEl.classList.remove('error'); expression += value; render();
}
function action(name) {
  if (name === 'clear') { expression = ''; result = '0'; completed = false; resultEl.classList.remove('error'); }
  if (name === 'delete') { expression = expression.slice(0, -1); completed = false; resultEl.classList.remove('error'); result = '0'; }
  if (name === 'calculate') {
    try {
      result = evaluate(expression); completed = true; resultEl.classList.remove('error');
      history.unshift({expression, result}); history = history.slice(0, 200); saveHistory(); renderHistory();
    } catch (error) { result = error.message; completed = false; resultEl.classList.add('error'); }
  }
  render();
}
document.querySelector('.keys').addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; if (button.dataset.value !== undefined) input(button.dataset.value); else action(button.dataset.action); });
document.getElementById('clear-history').addEventListener('click', () => { history = []; saveHistory(); renderHistory(); });
document.addEventListener('keydown', event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (/^[0-9.+*/()\-]$/.test(event.key)) { event.preventDefault(); input(event.key); }
  else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); action('calculate'); }
  else if (event.key === 'Backspace') { event.preventDefault(); action('delete'); }
  else if (event.key === 'Escape') { event.preventDefault(); action('clear'); }
});
render(); renderHistory();
</script>
</body>
</html>
